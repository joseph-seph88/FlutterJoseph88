workflows:
  default:
    name: Flutter CI/CD
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    environment:
      groups:
        - keystore_credentials
      flutter: 3.27.1
      xcode: latest
    scripts:
      - echo $CM_KEYSTORE
      - echo $CM_KEYSTORE | base64 --decode > ./android/app/google-services.json
      - flutter pub get
      - flutter build apk --release
