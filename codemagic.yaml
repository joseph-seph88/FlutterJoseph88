workflows:
  default:
    name: Flutter CI/CD
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    environment:
      groups:
        - keystore_credentials
    scripts:
      - echo $CM_KEYSTORE
      - echo $CM_KEYSTORE | base64 --decode > ./android/app/
      - flutter pub get
      - flutter build apk --release
