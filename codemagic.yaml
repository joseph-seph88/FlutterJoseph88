workflows:
  default:
    name: Flutter CI/CD
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    environment:
      groups:
        - keystore_credentials
      flutter: 3.27.1
      xcode: latest
    scripts:
      - echo $CM_GOOGLE_SERVICES_JSON | base64 --decode > ./android/app/google-services.json
      - echo $CM_GOOGLE_SERVICES_PLIST | base64 --decode > ./ios/Runner/GoogleService-Info.plist
      - flutter pub get
      - dart format --set-exit-if-changed .
      - flutter analyze

      - name: Widget test or Unit test
        script: flutter test

      - name: Integration test on iOS Simulator
        script: |
          flutter config --enable-web
          flutter emulators
          
          EMULATOR_ID="apple_ios_simulator"
          echo "Launching iOS simulator: $EMULATOR_ID"
          flutter emulators --launch $EMULATOR_ID &
          
          sleep 10
          flutter devices
          
          DEVICE_ID=$(flutter devices | grep -i 'iPhone' | awk '{print $1}')
          echo "Detected iOS Simulator ID: $DEVICE_ID"
          
          if [ -z "$DEVICE_ID" ]; then
            echo "❌ No iOS simulator detected! Exiting..."
            exit 1
          fi
          
          flutter -d $DEVICE_ID test integration_test

      - flutter build apk --release
      - flutter build ios --release --no-codesign
      - flutter build web

    artifacts:
      - ./build/app/outputs/flutter-apk/app-release.apk
      - ./build/ios/iphoneos/Runner.app
      - ./build/web