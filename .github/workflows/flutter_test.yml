name: Flutter CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - personal_select_chat

jobs:
  widget_test:
    name: 위젯 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 코드 포맷 검사
        run: dart format --set-exit-if-changed .

      - name: 분석 (Lint)
        run: flutter analyze

      - name: 위젯 테스트 실행
        run: flutter test test/login/login_widget_test.dart

  integration_test:
    name: 통합 테스트
    needs: widget_test
    runs-on: macos-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          cache: true

      - name: Java 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: 의존성 설치
        run: flutter pub get

      - name: Android 통합 테스트 실행
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            flutter devices
            flutter test integration_test/app_flow_test.dart -d emulator-5554
          emulator-build: 7425822