name: Flutter CI

on:
    push:
        branches: 
            - '*'
    pull_request:
        branches:
            - personal_select_chat

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: 저장소 체크아웃
              uses: actions/checkout@v4

            - name: Flutter 설정
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: 3.27.1
                  cache: true

            - name: 의존성 설치
              run: flutter pub get

            - name: Android SDK 설치
              run: |
                sudo apt-get update
                sudo apt-get install -y wget unzip openjdk-11-jdk
                mkdir -p $HOME/Android/Sdk
                cd $HOME/Android/Sdk
                wget https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip
                unzip commandlinetools-linux-7583922_latest.zip
                rm commandlinetools-linux-7583922_latest.zip
                yes | $HOME/Android/Sdk/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android/Sdk --update
                yes | $HOME/Android/Sdk/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android/Sdk "platform-tools" "build-tools;30.0.3" "system-images;android-30;google_apis;x86_64"

            - name: ADB 환경 변수 설정
              run: echo "export PATH=\$PATH:$HOME/Android/Sdk/platform-tools" >> $GITHUB_ENV


            - name: Android Emulator 설정
              run: |
                yes | $HOME/Android/Sdk/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android/Sdk "system-images;android-30;google_apis;x86_64"
                $HOME/Android/Sdk/cmdline-tools/bin/avdmanager create avd --name test --package "system-images;android-30;google_apis;x86_64" --device "Nexus 5X" --force
                emulator -avd test -no-audio -no-window &

            - name: ADB 연결 확인
              run: |
                sleep 30
                adb devices

            - name: 코드 포맷 검사
              run: dart format --set-exit-if-changed .

            - name: 분석 (Lint)
              run: flutter analyze

            - name: 유닛 테스트 & 위젯 테스트 실행
              run: flutter test test/login/login_widget_test.dart

            - name: 통합 테스트
              run: flutter test integration_test/app_flow_test.dart
